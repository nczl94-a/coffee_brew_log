<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brew Log</title>
  <meta name="theme-color" content="#96552a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brew Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">☕ Brew Log <span class="count" id="brewCount"></span></div>
    <div class="topbar-actions">
      <button class="btn ghost sm" id="exportBtn" title="Download all data as JSON">Export</button>
      <label class="btn ghost sm" title="Load data from a JSON export">Import
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="log" class="active"><span class="ti" aria-hidden="true">✍️</span>Log brew</button>
    <button data-view="history"><span class="ti" aria-hidden="true">📖</span>History</button>
    <button data-view="beans"><span class="ti" aria-hidden="true">🫘</span>Beans</button>
    <button data-view="favourites"><span class="ti" aria-hidden="true">⭐</span>Favourites</button>
    <button data-view="recipes"><span class="ti" aria-hidden="true">🎲</span>Recipes</button>
  </nav>

  <main>
    <!-- LOG -->
    <section id="view-log" class="view active">
      <form id="brewForm" class="card form" autocomplete="off">
        <div class="form-head">
          <h2 id="brewFormTitle">Log a brew</h2>
          <button type="button" class="btn ghost sm" id="copyLastBtn">Copy last brew</button>
        </div>

        <div class="method-picker" id="methodPicker">
          <label><input type="radio" name="method" value="pourover" checked><span>Pour-over</span></label>
          <label><input type="radio" name="method" value="aeropress"><span>AeroPress</span></label>
          <label><input type="radio" name="method" value="rok"><span>ROK Presso GC Pro</span></label>
        </div>

        <div class="grid">
          <label class="span2">Bean
            <div class="row">
              <select name="beanId" id="beanSelect"></select>
              <button type="button" class="btn ghost sm" id="quickAddBean">+ New bean</button>
            </div>
          </label>
          <label>Date &amp; time<input type="datetime-local" name="date" required></label>
          <label>Recipe / label<input name="recipeName" placeholder="optional"></label>
          <label>Dose (g)<input type="number" step="0.1" min="0" name="dose" inputmode="decimal" required></label>
          <label><span id="waterLabel">Water (g)</span><input type="number" step="0.1" min="0" name="water" inputmode="decimal" required></label>
          <div class="ratio-pill span2" id="ratioOut">Ratio —</div>
          <label>Water temp (°C)<input type="number" step="1" name="temp" inputmode="numeric"></label>
          <label><span id="timeLabel">Total time (m:ss)</span><input name="time" placeholder="3:30" inputmode="numeric"></label>
          <label>Grinder<input name="grinder" list="grinderList" placeholder="e.g. Comandante C40"></label>
          <label>Grind setting<input name="grind" placeholder="e.g. 24 clicks"></label>
        </div>
        <datalist id="grinderList"></datalist>

        <fieldset class="method-fields">
          <legend id="methodLegend">Pour-over details</legend>
          <div class="grid" id="methodFields"></div>
        </fieldset>

        <div class="field">
          <span class="field-label">Rating</span>
          <div class="stars" id="ratingInput" role="radiogroup" aria-label="Rating"></div>
        </div>
        <label>Tasting notes<textarea name="notes" rows="3" placeholder="Sweet, juicy, a bit astringent at the end…"></textarea></label>
        <label class="check"><input type="checkbox" name="favourite"> ★ Add to favourite brews</label>

        <div class="form-actions">
          <button type="button" class="btn ghost" id="cancelEdit" hidden>Cancel edit</button>
          <button type="button" class="btn ghost" id="clearForm">Clear</button>
          <button class="btn primary" type="submit" id="saveBrewBtn">Save brew</button>
        </div>
      </form>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="view">
      <div class="toolbar">
        <div class="chips" id="historyMethodChips">
          <button data-m="" class="chip active">All</button>
          <button data-m="pourover" class="chip">Pour-over</button>
          <button data-m="aeropress" class="chip">AeroPress</button>
          <button data-m="rok" class="chip">ROK</button>
        </div>
        <div class="toolbar-row">
          <input type="search" id="historySearch" placeholder="Search beans, notes, recipes…">
          <select id="historySort">
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="rating">Top rated</option>
          </select>
          <label class="check inline"><input type="checkbox" id="historyFavOnly"> ★ only</label>
        </div>
      </div>
      <div id="historyList" class="list"></div>
    </section>

    <!-- BEANS -->
    <section id="view-beans" class="view">
      <div class="toolbar">
        <div class="toolbar-row">
          <input type="search" id="beanSearch" placeholder="Search beans…">
          <label class="check inline"><input type="checkbox" id="beanFavOnly"> ★ only</label>
          <button class="btn primary sm" id="addBeanBtn">+ Add bean</button>
        </div>
      </div>
      <div id="beanList" class="bean-grid"></div>
    </section>

    <!-- FAVOURITES -->
    <section id="view-favourites" class="view">
      <h2 class="section-title">Favourite beans</h2>
      <div id="favBeans" class="bean-grid"></div>
      <h2 class="section-title">Favourite brews</h2>
      <div id="favBrews" class="list"></div>
    </section>

    <!-- RECIPES -->
    <section id="view-recipes" class="view">
      <div class="chips big" id="recipeTabs">
        <button data-r="pourover" class="chip active">Pour-over recipes</button>
        <button data-r="aeropress" class="chip">AeroPress dice</button>
      </div>

      <div id="recipe-pourover" class="recipe-pane">
        <div class="card">
          <div class="form-head">
            <h2>Pour-over recipe generator</h2>
            <button class="btn ghost sm" id="surpriseBtn">🎲 Surprise me</button>
          </div>
          <div class="recipe-picker" id="pourRecipeList"></div>
          <div class="grid controls" id="pourControls"></div>
        </div>
        <div id="pourOutput"></div>
      </div>

      <div id="recipe-aeropress" class="recipe-pane" hidden>
        <div class="card">
          <div class="form-head">
            <h2>AeroPress dice</h2>
            <button class="btn primary" id="rollBtn">🎲 Roll the dice</button>
          </div>
          <p class="muted small">Inspired by James Hoffmann's AeroPress dice. Tap a die to lock it, then re-roll the rest.</p>
          <div class="dice-grid" id="diceGrid"></div>
          <div class="classics">
            <span class="muted small">Or brew a classic:</span>
            <div class="chips" id="apClassics"></div>
          </div>
        </div>
        <div id="apOutput"></div>
      </div>
    </section>
  </main>

  <!-- Bean dialog -->
  <dialog id="beanDialog">
    <form id="beanForm" method="dialog" class="form">
      <h2 id="beanDialogTitle">Add bean</h2>
      <div class="grid">
        <label class="span2">Name<input name="name" required placeholder="e.g. Ethiopia Guji Hambela"></label>
        <label>Roaster<input name="roaster"></label>
        <label>Origin<input name="origin" placeholder="Country / region"></label>
        <label>Process
          <select name="process">
            <option value=""></option><option>Washed</option><option>Natural</option><option>Honey</option>
            <option>Anaerobic</option><option>Wet-hulled</option><option>Experimental</option><option>Blend</option>
          </select>
        </label>
        <label>Roast level
          <select name="roastLevel">
            <option value=""></option><option>Light</option><option>Medium-light</option><option>Medium</option>
            <option>Medium-dark</option><option>Dark</option>
          </select>
        </label>
        <label>Varietal<input name="varietal" placeholder="e.g. Gesha, SL28"></label>
        <label>Roast date<input type="date" name="roastDate"></label>
        <label class="span2">Notes<textarea name="notes" rows="2" placeholder="Roaster's tasting notes, price, where bought…"></textarea></label>
      </div>
      <label class="check"><input type="checkbox" name="favourite"> ★ Favourite bean</label>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="beanCancel">Cancel</button>
        <button type="submit" class="btn primary">Save bean</button>
      </div>
    </form>
  </dialog>

  <!-- Brew timer -->
  <div id="timer" class="timer" hidden>
    <div class="timer-head">
      <strong id="timerTitle">Brew timer</strong>
      <button class="btn ghost sm" id="timerClose" aria-label="Close timer">✕</button>
    </div>
    <div class="timer-clock" id="timerClock">0:00</div>
    <div class="timer-now" id="timerNow"></div>
    <div class="timer-next muted" id="timerNext"></div>
    <div class="timer-actions">
      <button class="btn primary" id="timerToggle">Start</button>
      <button class="btn ghost" id="timerReset">Reset</button>
      <button class="btn ghost" id="timerLog">Log brew</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
